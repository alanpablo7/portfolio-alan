<article class="content-card">
  {% if include.item.cover %}
    <a class="card-media" href="{{ include.item.url | relative_url }}">
      <img src="{{ include.item.cover | relative_url }}" alt="Capa de {{ include.item.title | escape }}" loading="lazy">
    </a>
  {% elsif include.item.youtube_id %}
    <a class="card-media" href="{{ include.item.url | relative_url }}">
      <img src="https://i.ytimg.com/vi/{{ include.item.youtube_id }}/hqdefault.jpg" alt="Capa do vídeo {{ include.item.title | escape }}" loading="lazy">
    </a>
  {% endif %}
  <div class="card-body">
    <div class="kicker">{{ include.item.tipo }}</div>
    <h2><a href="{{ include.item.url | relative_url }}">{{ include.item.title }}</a></h2>
    <p>{{ include.item.summary }}</p>
    {% if include.item.tags %}<div class="tag-row compact">{% for tag in include.item.tags limit:3 %}<span>{{ tag }}</span>{% endfor %}</div>{% endif %}
    <a class="text-link" href="{{ include.item.url | relative_url }}">Ler mais →</a>
  </div>
</article>
